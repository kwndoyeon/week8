<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drop the Tiles</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: start center;
      overflow: hidden;
      background: #EBEAEA;
    }

    #screen {
      position: relative;
      width: 100vw;
      aspect-ratio: 790 / 513;
      overflow: hidden;
      background: #EBEAEA;
    }

    #scene {
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      grid-template-columns: 82fr 120fr 154fr 96fr 182fr 156fr;
      width: 2257.142857px;
      height: 1465.714286px;
      transform-origin: top left;
      will-change: transform;
    }

    .photo-cell {
      position: relative;
      min-width: 0;
      height: 100%;
      overflow: hidden;
      background: #EBEAEA;
    }

    .tile {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      will-change: transform;
    }

    .tile img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
    }

    .drop-word {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 3;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap:120px ;
  color: #000;
  font-family: "Pretendard", sans-serif;
  font-size: 178pt;
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.075em;
  visibility: hidden;
  pointer-events: none;
}

.drop-word span {
  display: block;
}

.drop-hover-cell:hover .tile img {
  opacity: 0;
}

.drop-hover-cell:hover .drop-word {
  visibility: visible;
}

    .title-cell {
      position: relative;
      z-index: 2;
      padding-left: 12px;
      overflow: visible;
      background: #EBEAEA;
      color: #000;
      font-family: "Pretendard", sans-serif;
      font-size: 178pt;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.075em;
      white-space: nowrap;
    }

    #gallery-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #EBEAEA;
   --photo-height: 13.2vh;
   --thumbnail-height: 13.2vh;
}

body.show-gallery #screen {
  display: none;
}

body.show-gallery #gallery-screen {
  display: block;
}

.gallery-wrap {
  display: grid;
  grid-template-rows: 20% 80%;
  width: 100%;
  height: 100%;
}

.gallery-header,
.gallery-content {
  display: grid;
  grid-template-columns: 7.55% minmax(0, 1fr);
  min-width: 0;
}

.mint-box {
  background: #59FFBA;
}

.thumbnail-row {
  position: relative;

}

.thumbnail {

  width: auto;
  height: var(--thumbnail-height);
  max-width: none;

.thumb-5  { left: 37.59%; --image-offset: 1.9cqw; }
.thumb-6  { left: 46.04%; --image-offset: 0cqw; }
.thumb-7  { left: 49.79%; --image-offset: 0.05cqw; }
.thumb-8  { left: 57.9%; --image-offset: 0cqw; }
.thumb-9  { left: 64.40%; --image-offset: 0cqw; }

}

}

.phrase-tiles-to {

}

.phrase-beat {

}

.phrase-drop {

}

/* 갤러리 위쪽 높이를 참고 이미지에 맞춤 */


/* 사진을 조금 키우고, 번호는 사진 위에 표시 */
.thumbnail-number {
  z-index: 3;
}

.thumbnail img {
  height: var(--thumbnail-height);
  z-index: 1;
}

/* 사진을 키운 뒤에도 6번과 7번이 붙도록 조정 */


/* 선 위에 흰 여백을 만들고 선을 조금 내림 */
.content-area::before {
  position: absolute;
  z-index: 0;
  top: 0;
  right: 0;
  left: 0;

  background: #fff;

}

.timeline {

}

.pink-phrase {
  z-index: 2;
    user-select: none;

}

.phrase-click {

}

.editor-stage {

#gallery-screen.editor-mode .content-area {

#gallery-screen.editor-mode .pink-phrase {

#gallery-screen.editor-mode .timeline {

.falling-layer {

#gallery-screen.editor-mode #play-button {
  display: inline-block;

.mint-box {
  display: grid;
  place-items: center;

  </style>

    <!-- 기존 분홍 글씨들을 모두 여기에 둬 -->
    <div class="pink-phrase phrase-click">CLICK TILES</div>
    <div class="pink-phrase phrase-tiles">TILES</div>

  <script>
    const screen = document.getElementById("screen");
    const scene = document.getElementById("scene");
    const movingLayers = [];

    let designScale = 0.35;

    const layerSettings = [
      {
        file: "1.png",
        direction: 1,
        speed: 500,
        smallGapMin: -50,
        smallGapMax: 80,
        largeGapMin: 120,
        largeGapMax: 200,
        largeGapChance: 0.3
      },
      {
        file: "2.png",
        direction: -1,
        speed: 420,
        smallGapMin: 20,
        smallGapMax: 80,
        largeGapMin: 200,
        largeGapMax: 300,
        largeGapChance: 0.3
      },
      { title: "THE" },
      {
        file: "6.png",
        direction: 1,
        speed: 500,
        smallGapMin: -15,
        smallGapMax: 90,
        largeGapMin: 80,
        largeGapMax: 150,
        largeGapChance: 0.5
      },
      {
        file: "7.png",
        direction: -1,
        speed: 500,
        smallGapMin: 10,
        smallGapMax: 60,
        largeGapMin: 100,
        largeGapMax: 150,
        largeGapChance: 0.5
      },
      {
        file: "11.png",
        direction: 1,
        speed: 550,
        smallGapMin: 10,
        smallGapMax: 90,
        largeGapMin: 130,
        largeGapMax: 180,
        largeGapChance: 0.35
      }
    ];

    function resizeScene() {
      designScale = 0.35 * (screen.clientWidth / 790);
      scene.style.transform = `scale(${designScale})`;

      movingLayers.forEach((layer) => {
        if (layer.image.naturalWidth) {
          buildLayer(layer);
        }
      });
    }

    function getRandomGap(layer) {
      const useLargeGap = Math.random() < layer.largeGapChance;

      const min = useLargeGap ? layer.largeGapMin : layer.smallGapMin;
      const max = useLargeGap ? layer.largeGapMax : layer.smallGapMax;
      const visibleGap = min + Math.random() * (max - min);

      return visibleGap / designScale;
    }

    function createTile(layer, y) {
      const tile = document.createElement("div");
      tile.className = "tile";

      const img = document.createElement("img");
      img.src = layer.file;
      img.alt = "";
      img.draggable = false;

      tile.appendChild(img);
      layer.cell.appendChild(tile);

      return { element: tile, y };
    }

    function buildLayer(layer) {
      if (!layer.image.naturalWidth) return;

      const width = layer.cell.clientWidth;
      if (!width) return;

      layer.cell.replaceChildren();

layer.dropWords.forEach((word) => {
  layer.cell.appendChild(word);
});

layer.tiles = [];

      layer.imageHeight =
        width * (layer.image.naturalHeight / layer.image.naturalWidth);

      layer.distanceSinceSpawn = 0;

      const buffer = Math.max(
        layer.imageHeight * 2,
        layer.cell.clientHeight * 0.35
      );

      if (layer.direction === 1) {
        let y = 0;

        while (y < layer.cell.clientHeight + buffer) {
          layer.tiles.push(createTile(layer, y));
          y += layer.imageHeight + getRandomGap(layer);
        }
      } else {
        let y = layer.cell.clientHeight - layer.imageHeight;

        while (y + layer.imageHeight > -buffer) {
          layer.tiles.push(createTile(layer, y));
          y -= layer.imageHeight + getRandomGap(layer);
        }
      }

      layer.nextSpawnDistance =
  layer.imageHeight * 0.8 + getRandomGap(layer);
    }

    layerSettings.forEach((setting) => {
      if (setting.title) {
        const title = document.createElement("div");
        title.className = "title-cell";
        title.textContent = setting.title;
        scene.appendChild(title);
        return;
      }

      const cell = document.createElement("div");
      cell.className = "photo-cell";
      scene.appendChild(cell);

      const layer = {
        file: setting.file,
        cell,
        direction: setting.direction,
        speed: setting.speed,
        smallGapMin: setting.smallGapMin,
        smallGapMax: setting.smallGapMax,
        largeGapMin: setting.largeGapMin,
        largeGapMax: setting.largeGapMax,
        largeGapChance: setting.largeGapChance,
        image: new Image(),
        imageHeight: 0,
        tiles: [],
        dropWords: [],
        dropStep: 0
      };

      if (setting.file === "1.png") {
  cell.classList.add("drop-hover-cell");

  const word = document.createElement("div");
  word.className = "drop-word";

  ["D", "R", "O", "P"].forEach((letter) => {
    const line = document.createElement("span");
    line.textContent = letter;
    word.appendChild(line);
  });

  const secondWord = word.cloneNode(true);
  layer.dropWords = [word, secondWord];

  layer.dropWords.forEach((item) => {
    cell.appendChild(item);
  });

  // 다음 DROP은 앞 글자와 같은 간격으로 이어지게 배치
  layer.dropStep = word.offsetHeight + 120;

  cell.addEventListener("mouseenter", () => {
    layer.dropWords.forEach((item, index) => {
      item.dropY = index === 0 ? 0 : -layer.dropStep;
      item.style.transform = `translate3d(0, ${item.dropY}px, 0)`;
    });
  });
}

      movingLayers.push(layer);

      layer.image.onload = () => buildLayer(layer);
      layer.image.src = layer.file;
    });

    resizeScene();
    window.addEventListener("resize", resizeScene);

    let previousTime = 0;

    function animate(time) {
      const deltaTime =
        previousTime === 0
          ? 0
          : Math.min((time - previousTime) / 1000, 0.05);

      previousTime = time;

      movingLayers.forEach((layer) => {
        if (!layer.imageHeight || layer.tiles.length === 0) return;

        const distance =
          (layer.speed * deltaTime) / designScale;

          if (layer.dropWords.length && layer.cell.matches(":hover")) {
  layer.dropWords.forEach((word) => {
    word.dropY += distance;
  });

  layer.dropWords.forEach((word) => {
    if (word.dropY > layer.cell.clientHeight) {
      const topY = Math.min(
        ...layer.dropWords.map((item) => item.dropY)
      );

      word.dropY = topY - layer.dropStep;
    }

    word.style.transform =
      `translate3d(0, ${word.dropY}px, 0)`;
  });
}

        layer.tiles.forEach((tile) => {
          tile.y += layer.direction * distance;
        });

        layer.distanceSinceSpawn += distance;

        while (layer.distanceSinceSpawn >= layer.nextSpawnDistance) {
          layer.distanceSinceSpawn -= layer.nextSpawnDistance;

          const newY =
            layer.direction === 1
              ? layer.distanceSinceSpawn
              : layer.cell.clientHeight -
                layer.imageHeight -
                layer.distanceSinceSpawn;

          layer.tiles.push(createTile(layer, newY));

          layer.nextSpawnDistance =
            layer.imageHeight + getRandomGap(layer);
        }

        layer.tiles = layer.tiles.filter((tile) => {
          const isOffscreen =
            layer.direction === 1
              ? tile.y >= layer.cell.clientHeight
              : tile.y + layer.imageHeight <= 0;

          if (isOffscreen) tile.element.remove();
          return !isOffscreen;
        });

        layer.tiles.forEach((tile) => {
          tile.element.style.transform =
            `translate3d(0, ${tile.y}px, 0)`;
        });
      });

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
    
    function alignClickTiles() {
  const clickLine = document.querySelector("#gallery-screen .phrase-click");
  const clickWord = clickLine?.querySelector("span:first-child");
  const tilesLine = document.querySelector("#gallery-screen .phrase-tiles");

  if (!clickLine || !clickWord || !tilesLine) return;

  const clickStyle = getComputedStyle(clickLine);
  const tilesStyle = getComputedStyle(tilesLine);

  const targetX =
    tilesLine.getBoundingClientRect().left +
    parseFloat(tilesStyle.paddingLeft);

  const clickStartX =
    clickLine.getBoundingClientRect().left +
    parseFloat(clickStyle.paddingLeft);

  const gap =
    targetX -
    clickStartX -
    clickWord.getBoundingClientRect().width;

  clickLine.style.gap = `${Math.max(0, gap)}px`;
}


window.addEventListener("resize", alignClickTiles);
document.fonts.ready.then(alignClickTiles);

(() => {
  const gallery = document.getElementById("gallery-screen");
  const stage = document.querySelector(".editor-stage");
  const scrollArea = document.querySelector(".content-area");
  const timeline = document.querySelector(".timeline");
  const thumbnailRow = document.querySelector(".thumbnail-row");
  const playButton = document.getElementById("play-button");
  const whiteRail = document.querySelector(".white-rail");
const timeIndicator = document.querySelector(".time-indicator");

  if (!gallery || !stage || !scrollArea || !timeline || !thumbnailRow || !playButton) {
    return;
  }

  const fallingLayer = document.createElement("div");
fallingLayer.className = "falling-layer";
document.body.appendChild(fallingLayer);

function fitFallingLayer() {
  const rect = scrollArea.getBoundingClientRect();
  fallingLayer.style.left = `${rect.left}px`;
  fallingLayer.style.top = `${rect.top}px`;
  fallingLayer.style.width = `${rect.width}px`;
  fallingLayer.style.height = `${rect.height}px`;
}

function showScoreAgain() {
  fallingLayer.replaceChildren();
  fallingLayer.style.display = "none";

  beatEvents.forEach((item) => {
    item.element.style.visibility = "visible";
  });
}

window.addEventListener("resize", fitFallingLayer);

  // 100px = 1초. 사진 사이의 간격과 재생 시간에 같이 적용돼.
  const pixelsPerSecond = 100;

  // .content-area::before의 흰 여백 높이(5.75%)와 맞춘 값
  const whiteGapRatio = 0.0575;

  const beatEvents = [];
  const timerIds = [];
  const playingAudios = [];

  let playheadY = 0;
  let lastPhotoFile = null;

  let lastPhotoClickTime = null;
  let lastPhotoEventY = 0;
  let isDragging = false;
  let isPlaying = false;
  let animationId = 0;
  let timeIndicatorAnimationId = 0;

  function grayAreaTop() {
    return scrollArea.clientHeight * whiteGapRatio;
  }

  function extendStage(requiredY) {
    const visibleHeight = scrollArea.clientHeight || window.innerHeight;
    const neededHeight = Math.max(
      visibleHeight,
      requiredY + visibleHeight * 0.25
    );

    if (neededHeight > stage.clientHeight) {
      stage.style.height = `${neededHeight}px`;
    }
  }

  function updateTimeIndicator(scoreY = playheadY) {
  const lineRect = timeline.getBoundingClientRect();
  const railRect = whiteRail.getBoundingClientRect();
  const lineCenterY = lineRect.top + lineRect.height / 2;

  timeIndicator.style.top =
    `${lineCenterY - railRect.top + (scoreY - playheadY)}px`;
}

function animateTimeIndicator() {
  if (
    isDragging ||
    isPlaying ||
    lastPhotoClickTime === null
  ) {
    timeIndicatorAnimationId = 0;
    return;
  }

  const elapsed = (performance.now() - lastPhotoClickTime) / 1000;
  const currentY = lastPhotoEventY + elapsed * pixelsPerSecond;

  updateTimeIndicator(currentY);
  timeIndicatorAnimationId = requestAnimationFrame(animateTimeIndicator);
}

function startTimeIndicator() {
  if (!timeIndicatorAnimationId) {
    timeIndicatorAnimationId = requestAnimationFrame(animateTimeIndicator);
  }
}

function alignSixAndSeven() {
  const row = document.querySelector(".thumbnail-row");
  const image6 = document.querySelector(".thumb-6 img");
  const image7 = document.querySelector(".thumb-7 img");

  if (
    !row ||
    !image6 ||
    !image7 ||
    !row.clientWidth ||
    !image6.naturalWidth ||
    !image7.naturalWidth
  ) {
    return;
  }

  const rowRect = row.getBoundingClientRect();
  const image6Rect = image6.getBoundingClientRect();
  const image7Rect = image7.getBoundingClientRect();
  const thumb7Rect = image7.parentElement.getBoundingClientRect();

  const gap = image6Rect.right - image7Rect.left;
  const newLeft =
    ((thumb7Rect.left - rowRect.left + gap) / rowRect.width) * 100;

  image7.parentElement.style.left = `${newLeft}%`;
}


window.addEventListener("resize", alignSixAndSeven);

  function setPlayhead(y) {

function createStackBacking(events, landingTopByEvent) {
  const canvas = document.createElement("canvas");
  canvas.className = "stack-backing";

  const width = Math.ceil(fallingLayer.clientWidth);
  const height = Math.ceil(fallingLayer.clientHeight);

  canvas.width = width;
  canvas.height = height;

  if (events.length === 0 || width === 0 || height === 0) {
    return canvas;
  }

  const context = canvas.getContext("2d");
  const padding = 24;

  // 사진 각각의 위치와 바깥 여백을 계산해
  const boxes = events
    .map((item) => {
      const x = (item.leftPercent / 100) * width;
      const y = landingTopByEvent.get(item);

      return {
        left: Math.max(0, x - padding),
        top: Math.max(0, y - padding),
        right: Math.min(width, x + item.width + padding),
        bottom: Math.min(height, y + item.height + padding)
      };
    })
    .filter((box) => box.right > box.left && box.bottom > box.top);

  if (boxes.length === 0) return canvas;

  // 사진이 놓인 높이마다 좌우 외곽을 계산해 이어 붙여
  const rows = [];

  for (let y = 0; y < height; y++) {
    const activeBoxes = boxes.filter(
      (box) => box.top < y + 1 && box.bottom > y
    );

    if (activeBoxes.length === 0) continue;

    rows.push({
      y,
      left: Math.min(...activeBoxes.map((box) => box.left)),
      right: Math.max(...activeBoxes.map((box) => box.right))
    });
  }

  context.fillStyle = "#000000";

  rows.forEach((row, index) => {
    context.fillRect(row.left, row.y, row.right - row.left, 1);

    // 사진 사이에 세로 빈틈이 있으면 외곽이 끊기지 않게 연결해
    const nextRow = rows[index + 1];
    if (!nextRow || nextRow.y <= row.y + 1) return;

    const gap = nextRow.y - row.y;

    for (let y = row.y + 1; y < nextRow.y; y++) {
      const progress = (y - row.y) / gap;
      const left = row.left + (nextRow.left - row.left) * progress;
      const right = row.right + (nextRow.right - row.right) * progress;

      context.fillRect(left, y, right - left, 1);
    }
  });

  return canvas;
}
